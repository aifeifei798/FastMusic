<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastMusic</title>
    <meta name="description" content="FastMusic 高性能本地音乐与 MTV 流媒体播放器，支持多目录扫描与智能 ID3 标签解析，Video.js 深度定制内核与海量媒体流畅播放。" />
    <meta property="og:title" content="FastMusic" />
    <meta property="og:description" content="FastMusic 高性能本地音乐与 MTV 流媒体播放器，支持多目录扫描与智能 ID3 标签解析，Video.js 深度定制内核与海量媒体流畅播放。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://raw.githubusercontent.com/aifeifei798/FastMusic/main/docs/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <script>
      // 首屏前确定主题, 避免深浅色切换时的闪烁(FOUC)。
      // App.tsx 里的 theme state 读同一个 localStorage key, 两者始终一致。
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('fastmusic_theme'); } catch (e) {}
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="bg-app text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
